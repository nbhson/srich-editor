<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRich Editor Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      padding: 40px 20px;
    }
    h1 { text-align: center; margin-bottom: 8px; color: #1f2937; }
    p.subtitle { text-align: center; color: #6b7280; margin-bottom: 32px; }
    #editor { max-width: 800px; margin: 0 auto; }

    .actions {
      max-width: 800px;
      margin: 24px auto 0;
      padding: 20px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn {
      padding: 8px 16px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      background: #fff;
      color: #374151;
      transition: all 0.15s;
    }
    .btn:hover { background: #f9fafb; border-color: #9ca3af; }

    .output {
      max-width: 800px;
      margin: 24px auto 0;
      padding: 16px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }
    .output h3 { font-size: 14px; color: #6b7280; margin-bottom: 8px; }
    .output pre {
      background: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
  <link rel="stylesheet" href="../dist/styles.css">
</head>
<body>
  <h1>SRich Editor</h1>
  <p class="subtitle">A lightweight, dependency-free rich text editor</p>

  <div id="editor"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn" onclick="showContent()">Get HTML Content</button>
    <button class="btn" onclick="showIsEmpty()">Check if Empty</button>
    <button class="btn" onclick="showComments()">Show Comments (JSON)</button>
  </div>

  <!-- HTML Output -->
  <div class="output">
    <h3>HTML Output (from getContent()):</h3>
    <pre id="output">Type something in the editor above, then click "Get HTML Content".</pre>
  </div>

  <!-- Export dependencies (needed for PDF and Word export) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx/build/index.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

  <script src="../dist/srich-editor.umd.js"></script>
  <script>
    var editor = SRichEditor.createEditor({
      container: '#editor',
      placeholder: 'Start typing your content here...',
      comments: {
        userName: 'Demo User',
        onCommentsChange: function(comments) {
          console.log('Comments updated:', comments.length);
        },
      },
      export: {
        documentTitle: 'Demo Document',
      },
      onChange: function(content) {
        document.getElementById('output').textContent = content;
      },
      onReady: function() {
        console.log('SRich Editor is ready!');
      }
    });

    function showContent() {
      var html = editor.getContent();
      document.getElementById('output').textContent = html;
    }

    function showIsEmpty() {
      var empty = editor.isEmpty();
      alert('Editor is ' + (empty ? 'empty' : 'not empty'));
    }

    function showComments() {
      var comments = editor.getComments();
      document.getElementById('output').textContent = JSON.stringify(comments, null, 2);
    }

    // Set initial output
    document.getElementById('output').textContent = editor.getContent();
  </script>
</body>
</html>
