<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRich Editor E2E Test Page</title>
  <link rel="stylesheet" href="../dist/styles.css">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #editor { margin-top: 20px; }
    #event-log { margin-top: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>SRich Editor E2E Test Page</h1>
  <div id="editor"></div>
  <div id="event-log"></div>

  <script src="../dist/srich-editor.umd.js"></script>
  <script>
    var logEl = document.getElementById('event-log');
    function logEvent(msg) {
      logEl.textContent += msg + '\n';
    }

    var editor = SRichEditor.createEditor({
      container: '#editor',
      placeholder: 'Start typing here...',
      comments: {
        userName: 'Test User',
        onCommentsChange: function(comments) {
          logEvent('onCommentsChange: ' + comments.length);
        },
      },
      export: {
        documentTitle: 'Test Document',
      },
      onChange: function(content) { logEvent('onChange: ' + content); },
      onReady: function() { logEvent('onReady fired'); },
      onFocus: function() { logEvent('onFocus fired'); },
      onBlur: function() { logEvent('onBlur fired'); },
    });

    // Expose editor instance for tests
    window.editorInstance = editor;
  </script>
</body>
</html>
